<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>はたらくまなび</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- タイトル -->
  <section id="s-title" class="screen active">
    <canvas id="titleCanvas" class="bg"></canvas>
    <button id="btn-gear" class="corner tr" type="button" aria-label="おうちのひと"><canvas width="64" height="64" data-icon="gear"></canvas><span class="ring"></span></button>
    <button id="btn-sound" class="corner tl" type="button" aria-label="おと"><canvas width="64" height="64" data-icon="speaker"></canvas></button>
    <div class="voice-x" hidden><canvas width="48" height="48" data-icon="speakerx"></canvas></div>
    <div class="title-box">
      <h1>はたらくまなび</h1>
      <div class="row">
        <button id="btn-go" class="big" type="button"><canvas width="96" height="96" data-icon="truck"></canvas><span>しゅつどう</span></button>
        <button id="btn-garage" class="big alt" type="button"><canvas width="96" height="96" data-icon="garage"></canvas><span>しゃこ</span></button>
      </div>
    </div>
  </section>

  <!-- 出動えらび -->
  <section id="s-pick" class="screen">
    <button id="btn-pick-back" class="corner tl" type="button" aria-label="もどる"><canvas width="64" height="64" data-icon="back"></canvas></button>
    <div class="pick-box">
      <h2>どっちで しゅつどう？</h2>
      <div class="row">
        <button id="btn-math" class="big math" type="button"><canvas width="96" height="96" data-icon="kazu"></canvas><span>かず</span></button>
        <button id="btn-letter" class="big letter" type="button"><canvas width="96" height="96" data-icon="moji"></canvas><span>もじ</span></button>
      </div>
    </div>
  </section>

  <!-- 出動（問題） -->
  <section id="s-play" class="screen">
    <header id="play-top">
      <button id="btn-quit" class="mini" type="button" aria-label="やめる（ながおし）"><canvas width="48" height="48" data-icon="x"></canvas><span class="ring"></span></button>
      <div id="lamps"><i></i><i></i><i></i><i></i></div>
      <div class="top-right">
        <div class="voice-x" hidden><canvas width="48" height="48" data-icon="speakerx"></canvas></div>
        <button id="btn-replay" class="replay" type="button" aria-label="もういちどきく"><canvas width="64" height="64" data-icon="speaker"></canvas></button>
      </div>
    </header>
    <div id="play-main">
      <div id="sceneWrap"><canvas id="sceneCanvas"></canvas></div>
      <div id="play-side">
        <div id="answers"></div>
      </div>
    </div>
  </section>

  <!-- ごほうび -->
  <section id="s-reward" class="screen">
    <div id="reward-box">
      <canvas id="cardCanvas"></canvas>
      <div id="reward-side">
        <div id="reward-text"></div>
        <div id="reward-sub"></div>
        <div class="row">
          <button id="btn-r-garage" class="big alt" type="button"><canvas width="96" height="96" data-icon="garage"></canvas><span>しゃこへ</span></button>
          <button id="btn-r-again" class="big" type="button"><canvas width="96" height="96" data-icon="truck"></canvas><span>もういちど</span></button>
        </div>
      </div>
    </div>
  </section>

  <!-- しゃこ -->
  <section id="s-garage" class="screen">
    <header class="bar">
      <button id="btn-g-back" class="mini" type="button" aria-label="もどる"><canvas width="48" height="48" data-icon="back"></canvas></button>
      <h2>しゃこ</h2><span id="g-count"></span>
    </header>
    <div id="garage-grid"></div>
  </section>

  <!-- おうちのひと -->
  <section id="s-parent" class="screen">
    <header class="bar">
      <button id="btn-p-back" class="mini" type="button" aria-label="もどる"><canvas width="48" height="48" data-icon="back"></canvas></button>
      <h2>おうちのひと</h2>
    </header>
    <div id="parent-body">
      <div class="card"><h3>すすみぐあい</h3><div id="p-progress"></div></div>
      <div class="card"><h3>おと</h3>
        <label class="chk"><input type="checkbox" id="p-sfx"> こうかおん</label>
        <label class="chk"><input type="checkbox" id="p-voice"> よみあげ</label>
        <button id="p-test" type="button" class="pbtn">よみあげテスト</button>
        <p id="p-voice-note" class="note"></p>
      </div>
      <div class="card"><h3>レベル</h3>
        <div class="lv"><span>かず</span><select id="p-lv-math"></select><label class="chk"><input type="checkbox" id="p-lock-math"> このレベルでこてい</label></div>
        <div class="lv"><span>もじ</span><select id="p-lv-letter"></select><label class="chk"><input type="checkbox" id="p-lock-letter"> このレベルでこてい</label></div>
        <p class="note">こていしないと、4もん ぜんぶ 1かいで せいかいで 1つ上がり、0〜1もんで 1つ下がります。</p>
      </div>
      <div class="card"><h3>データ</h3>
        <button id="p-clear" type="button" class="pbtn danger">データをけす</button>
        <p id="p-clear-note" class="note"></p>
        <p id="p-storage-note" class="note" hidden>この たんまつでは ほぞんできません（とじると きえます）。</p>
      </div>
    </div>
  </section>

  <div id="debug" hidden></div>
</div>

<script src="src/data.js"></script>
<script src="src/problems.js"></script>
<script src="src/rewards.js"></script>
<script src="src/storage.js"></script>
<script src="src/vehicles.js"></script>
<script src="src/audio.js"></script>
<script src="src/speech.js"></script>
<script src="src/scenes.js"></script>
<script src="src/ui.js"></script>
<script src="src/main.js"></script>
</body>
</html>
